<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Pinta Express</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h2>Pinta Express</h2>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="tiendas.html">Tiendas</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h1>Contáctanos</h1>

            <p>
                ¿Tienes un negocio de ropa y quieres digitalizar tu catálogo?
                Ponte en contacto con nosotros y conoce cómo Pinta Express puede ayudarte.
            </p>
        </section>

        <section>

            <form id="formularioContacto">

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo">

                <label for="negocio">Nombre del negocio</label>
                <input type="text" id="negocio">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5"></textarea>

                <p id="mensajeFormulario"></p>

                <button type="submit">
                    Enviar solicitud
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Pinta Express. Todos los derechos reservados.</p>
        <p>Bogotá, Colombia</p>
    </footer>

    <script src="js/contacto.js"></script>

</body>

</html>
